<div class="container">
  <h2 class="mb-4" style="text-align: center; margin-top: 20px;">
    {{ id ? 'Edit Student' : 'Add Student' }}
  </h2>
</div>

<div class="container mt-4" style="max-width: 600px;">
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>

    <div class="mb-3">
      <label for="name" class="form-label">Student Name</label>
      <input id="name" type="text" class="form-control"
             formControlName="name"
             [class.is-invalid]="form.controls.name.touched && form.controls.name.invalid" />
      <div class="invalid-feedback">Name is required</div>
    </div>

    <div class="mb-3">
      <label for="department" class="form-label">Department</label>
      <input id="department" type="text" class="form-control"
             formControlName="department"
             [class.is-invalid]="form.controls.department.touched && form.controls.department.invalid" />
      <div class="invalid-feedback">Department is required</div>
    </div>

    <div class="mb-3">
      <label for="gender" class="form-label">Gender</label>
      <select id="gender" class="form-select"
              formControlName="gender"
              [class.is-invalid]="form.controls.gender.touched && form.controls.gender.invalid">
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
      <div class="invalid-feedback">Gender is required</div>
    </div>

    <div class="mb-3">
      <label for="emailID" class="form-label">Email</label>
      <input id="emailID" type="email" class="form-control"
             formControlName="emailID"
             [class.is-invalid]="form.controls.emailID.touched && form.controls.emailID.invalid" />
      <div class="invalid-feedback">Enter a valid email</div>
    </div>

    <div class="mb-4">
      <label for="dob" class="form-label">DOB</label>
      <input id="dob" type="date" class="form-control"
             formControlName="dateOfBirth"
             [class.is-invalid]="form.controls.dateOfBirth.touched && form.controls.dateOfBirth.invalid" />
      <div class="invalid-feedback">Date of birth is required</div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" style="border-radius: 20px;">
        {{ id ? 'Update' : 'Add' }}
      </button>
      <button type="button" class="btn btn-secondary" style="border-radius: 20px;" (click)="cancel()">
        Cancel
      </button>
    </div>

  </form>
</div>
